services:
  mongo:
    image: mongo:7
    container_name: emailservice_mongo
    ports:
      # Host port 27018 so this project can run alongside another MongoDB on 27017.
      - '27018:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: emailservice_redis
    ports:
      # Host port 6380 so this project can run alongside another Redis on 6379.
      - '6380:6379'
    restart: unless-stopped

volumes:
  mongo_data:
