name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27018:27017']
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
    env:
      MONGODB_URI: mongodb://localhost:27018/emailservice
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: ci-only-secret
      AI_KEY_ENCRYPTION_SECRET: ci-only-encryption-secret
      AI_ENABLED: 'true'
      AI_QUEUE_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Server deps
        working-directory: server
        run: npm ci
      - name: Client deps
        working-directory: client
        run: npm ci
      - name: Server typecheck
        working-directory: server
        run: npx tsc --noEmit -p .
      - name: Client typecheck + build
        working-directory: client
        run: npx tsc -b
      - name: Server tests
        working-directory: server
        run: npm test
