<text x="235" y="724" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="15.5" fill="#d12b2b" font-weight="bold" text-anchor="middle">Gmail API / SendGrid</text>
<text x="235" y="744" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">your own OAuth token, or the</text>
<text x="235" y="761" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">org's domain-authenticated key</text>
