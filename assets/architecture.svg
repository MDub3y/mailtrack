<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 1150" width="1540" height="1150"><rect width="1540" height="1150" fill="#fdfcf7"/>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2176c7"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8730c"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d12b2b"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b7f3b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6a4fc7"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#777"/></marker></defs>
<text x="770" y="34" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="23" fill="#2b2b2b" font-weight="bold" text-anchor="middle">Proofbox — System Architecture</text>
<text x="770" y="58" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="12.5" fill="#555" font-weight="normal" text-anchor="middle">the outbox that proves what it remembers — MongoDB is the source of truth, BullMQ relays work, every model call leaves a receipt</text>
<rect x="590" y="86" width="380" height="76" rx="3" fill="#ffffff" stroke="#2176c7" stroke-width="2"/>
<text x="780" y="110" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="15.5" fill="#2176c7" font-weight="bold" text-anchor="middle">Browser</text>
<text x="780" y="130" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">React 19 · Vite · TypeScript</text>
<text x="780" y="147" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">Sent · Contacts · Queue · Triage · Integrity · Runs · Today</text>
<rect x="70" y="250" width="320" height="76" rx="3" fill="#ffffff" stroke="#777" stroke-width="2"/>
<text x="230" y="274" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="15.5" fill="#777" font-weight="bold" text-anchor="middle">Gmail INBOX (read grant)</text>
<text x="230" y="294" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">gmail.readonly — a second, separate,</text>
<text x="230" y="311" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">revocable consent · user-chosen pull window</text>
<rect x="560" y="250" width="440" height="76" rx="3" fill="#ffffff" stroke="#2176c7" stroke-width="2"/>
<text x="780" y="274" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="15.5" fill="#2176c7" font-weight="bold" text-anchor="middle">server/Express API (:5000)</text>
<text x="780" y="294" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">auth · emails · track · share · inbox · memory · queue</text>
<text x="780" y="311" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">integrity · digest · integrations · mcp (read-only)</text>
<rect x="1130" y="250" width="340" height="76" rx="3" fill="#ffffff" stroke="#1b7f3b" stroke-width="2"/>
<text x="1300" y="274" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="15.5" fill="#1b7f3b" font-weight="bold" text-anchor="middle">Recipient's mail client</text>
<text x="1300" y="294" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">opens (pixel fires) · clicks links · replies</text>
<text x="1300" y="311" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">reaches the API via public BASE_URL</text>
