<text x="265" y="504" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="15.5" fill="#2b2b2b" font-weight="bold" text-anchor="middle">MongoDB (:27018) — source of truth</text>
<text x="265" y="524" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">Email · Contact · Signal · Memory · Proposal</text>
<text x="265" y="541" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">Label · AgentRun · InboundMessage · Category</text>
<text x="265" y="558" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">Webhook · AiSettings (keys encrypted, select:false)</text>
<rect x="600" y="470" width="360" height="76" rx="3" fill="#ffffff" stroke="#e8730c" stroke-width="2"/>
<text x="780" y="494" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="15.5" fill="#e8730c" font-weight="bold" text-anchor="middle">Redis + BullMQ (:6380)</text>
<text x="780" y="514" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">emailQueue — send jobs, retries</text>
<text x="780" y="531" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">aiQueue — extract · classify · inbox sync · digest · drift</text>
<rect x="1090" y="470" width="390" height="110" rx="3" fill="#ffffff" stroke="#6a4fc7" stroke-width="2"/>
<text x="1285" y="494" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="15.5" fill="#6a4fc7" font-weight="bold" text-anchor="middle">AI layer — runAgent (the one wrapper)</text>
<text x="1285" y="514" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">budget → context receipt → schema →</text>
<text x="1285" y="531" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">citation check → run log (exact prompt kept)</text>
<text x="1285" y="548" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">extractor + entailment gate · brief · draft</text>
<text x="1285" y="565" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">classify tiers · investigator · replay · trust</text>
<rect x="600" y="680" width="360" height="93" rx="3" fill="#ffffff" stroke="#d12b2b" stroke-width="2"/>
<text x="780" y="704" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="15.5" fill="#d12b2b" font-weight="bold" text-anchor="middle">Email worker — exactly once</text>
<text x="780" y="724" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">durable outbox claim → dispatch → delivered</text>
<text x="780" y="741" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">crash ⇒ "outcome unknown", never a re-send</text>
<text x="780" y="758" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">bulk resumable by (job, index)</text>
