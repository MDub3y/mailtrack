<text x="1300" y="744" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="15.5" fill="#6a4fc7" font-weight="bold" text-anchor="middle">Model providers — BYOK</text>
<text x="1300" y="764" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">OpenRouter · Anthropic · any OpenAI-</text>
<text x="1300" y="781" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">compatible · free models · caps degrade, recorded</text>
<rect x="70" y="875" width="390" height="76" rx="3" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
<text x="265" y="899" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="15.5" fill="#2b2b2b" font-weight="bold" text-anchor="middle">Your other systems</text>
<text x="265" y="919" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="11.5" fill="#555" font-weight="normal" text-anchor="middle">MCP read-only (4 tools, revocable token)</text>
